<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Santa Calibration & Settings</title>
    <link rel="stylesheet" href="/src/calibrate_style.css" />
  </head>
  <body>
    <div id="app">
      <header>
        <div class="header-left">
          <a href="/" class="btn-back" title="กลับไปหน้าหัวซานต้า">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="m15 18-6-6 6-6"/>
            </svg>
            หน้าหลัก
          </a>
          <h2>Settings & Calibrate 🎯</h2>
        </div>
        <div id="connection_badge" class="badge disconnected">Disconnected</div>
      </header>

      <!-- Connect box -->
      <div id="connect_box" class="card">
        <label>Room ID ของจอใหญ่:</label>
        <div class="input-group">
          <input type="text" id="input_room_id" value="santa-main" placeholder="santa-main" />
          <button id="btn_connect">เชื่อมต่อ</button>
        </div>
      </div>

      <!-- Live Face Status from Playbox -->
      <div class="card status-card">
        <h4>ข้อมูลจากกล้อง Playbox:</h4>
        <div class="info-grid">
          <div>สถานะคน: <strong id="val_face_status">ไม่พบคน</strong></div>
          <div>กล้อง X: <strong id="val_cam_x">-</strong></div>
          <div>กล้อง Y: <strong id="val_cam_y">-</strong></div>
          <div>ขนาดหน้า (ระยะ): <strong id="val_cam_size">-</strong></div>
        </div>
      </div>

      <!-- Realtime Rotation Slider -->
      <div class="card control-card">
        <h4>ปรับมุมหันปัจจุบัน (Realtime)</h4>
        
        <div class="control-row">
          <div class="label-row">
            <span>หัน ซ้าย-ขวา (Yaw):</span>
            <span id="label_yaw">0.00</span>
          </div>
          <input type="range" id="slider_yaw" min="-1.5" max="1.5" step="0.01" value="0" />
        </div>

        <div class="control-row">
          <div class="label-row">
            <span>ก้ม-เงย (Pitch):</span>
            <span id="label_pitch">0.00</span>
          </div>
          <input type="range" id="slider_pitch" min="-0.8" max="0.8" step="0.01" value="0" />
        </div>

        <div class="control-row">
          <div class="label-row">
            <span>เอียงคอ (Roll):</span>
            <span id="label_roll">0.00</span>
          </div>
          <input type="range" id="slider_roll" min="-0.6" max="0.6" step="0.01" value="0" />
        </div>

        <div class="button-group">
          <button id="btn_reset_rot" class="btn-secondary">รีเซ็ตมุม</button>
          <button id="btn_save_point" class="btn-primary">💾 บันทึกจุดนี้ (Save Point)</button>
        </div>
      </div>

      <!-- Calibrated Points List -->
      <div class="card points-card">
        <div class="card-header">
          <h4>จุดที่บันทึกไว้ (<span id="points_count">0</span>)</h4>
          <button id="btn_clear_points" class="btn-danger-text">ล้างทั้งหมด</button>
        </div>
        <ul id="points_list"></ul>

        <div class="backup-group">
          <button id="btn_export_json" class="btn-secondary">📤 สำรองข้อมูล (JSON)</button>
          <label class="btn-secondary file-label">
            📥 นำเข้าข้อมูล
            <input type="file" id="file_import_json" accept=".json" style="display:none" />
          </label>
        </div>
      </div>
    </div>

    <script type="module" src="/src/calibrate_main.js"></script>
  </body>
</html>
